# Windows-ROOT : Avast dechiffre le HTTPS et re-signe avec sa propre autorite,
# absente du cacerts de la JVM. Java lit ici le magasin Windows (voir Portainer Remote).
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=Windows-ROOT
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
