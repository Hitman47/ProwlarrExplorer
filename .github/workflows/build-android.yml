name: build-android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore depuis les secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret KEYSTORE_B64 absent : lance signing/push-secrets.ps1"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > signing/release.jks
          printf 'storeFile=signing/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release
        run: |
          # Le trustStoreType=Windows-ROOT de gradle.properties n'existe pas sous Linux.
          sed -i 's/ -Djavax.net.ssl.trustStoreType=Windows-ROOT//' gradle.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Nommer l'APK
        id: apk
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "ProwlarrExplorer-$V.apk"
          echo "name=ProwlarrExplorer-$V.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Release GitHub (sur tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
